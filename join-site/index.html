<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Join a trip · Berzh Mate</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0B1020; color: #E6EDF7; margin: 0; min-height: 100vh;
           display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
    .card { max-width: 420px; width: 100%; background: #151D33; border: 1px solid #2A3658; border-radius: 20px; padding: 28px; text-align: center; }
    .btn { display: block; margin: 16px 0; background: #2DD4BF; color: #0B1020; padding: 14px; border-radius: 12px; font-weight: bold; text-decoration: none; }
    .muted { color: #8B96B0; font-size: 14px; }
    code { font-size: 20px; letter-spacing: 3px; background: #1E2844; padding: 6px 12px; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Join a trip on Berzh Mate</h2>
    <p>Invite code: <code id="code">—</code></p>
    <a id="open" class="btn" href="#">Open in Berzh Mate</a>
    <p class="muted">Don't have the app yet? Download it from the link you were sent, then enter this code under Trip groups → Join with a code.</p>
  </div>
  <script>
    var code = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '').toUpperCase();
    var isAndroid = /Android/i.test(navigator.userAgent);
    var fallback = 'https://github.com/devthanseemx/berzh-mate/releases/latest';
    var intentUrl = 'intent://join/' + code + '#Intent;scheme=berzhmate;package=com.devthanseemx.berzhmate;S.browser_fallback_url=' + encodeURIComponent(fallback) + ';end';

    document.getElementById('code').textContent = code || '—';
    document.getElementById('open').href = isAndroid ? intentUrl : 'berzhmate://join/' + code;
    if (isAndroid && code) location.href = intentUrl;
  </script>
</body>
</html>
